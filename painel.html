<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Painel — Moisés Gourmet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=3">
<script src="firebase-config.js?v=3"></script>
</head>
<body class="admin">
<section id="login" class="login">
  <form id="loginForm" class="login-box" novalidate>
    <span class="logo-mark big">M</span>
    <h1>Painel administrativo</h1>
    <input id="lEmail" type="email" autocomplete="username" hidden>
    <label>Senha <input id="lPass" type="password" required autocomplete="current-password"></label>
    <p id="lMsg" class="msg" role="alert"></p>
    <button class="btn gold lg" id="lBtn" type="submit">Entrar</button>
    <a class="back" href="index.html">← Voltar ao site</a>
  </form>
</section>

<div id="app" hidden>
  <header class="hdr">
    <a class="logo" href="index.html"><span class="logo-mark">M</span>Painel</a>
    <nav class="tabs" id="tabs">
      <button data-tab="dash" class="on">Dashboard</button><button data-tab="prod">Produtos</button>
      <button data-tab="ped">Pedidos</button><button data-tab="cfg">Configurações</button>
    </nav>
    <button class="btn out sm" id="logout">Sair</button>
  </header>

  <main class="panel">
    <section id="tab-dash">
      <div class="stats" id="stats"></div>
      <div class="two">
        <div class="box"><h3>Pedidos nos últimos 7 dias</h3><div id="chart7" class="bars"></div></div>
        <div class="box"><h3>Pedidos por status</h3><div id="chartSt" class="hbars"></div></div>
      </div>
      <div class="two">
        <div class="box"><h3>Pedidos recentes</h3><div id="recent"></div></div>
        <div class="box"><h3>Produtos mais solicitados</h3><div id="top"></div></div>
      </div>
    </section>

    <section id="tab-prod" hidden>
      <div class="bar"><h2>Produtos</h2><button class="btn gold" id="newProd">+ Novo produto</button></div>
      <div id="prodList"></div>
    </section>

    <section id="tab-ped" hidden>
      <div class="bar"><h2>Pedidos</h2>
        <select id="stFilter"><option value="">Todos os status</option><option value="novo">Novo</option><option value="andamento">Em andamento</option><option value="concluido">Concluído</option><option value="cancelado">Cancelado</option></select>
      </div>
      <div id="ordList"></div>
    </section>

    <section id="tab-cfg" hidden>
      <h2>Configurações</h2>
      <form id="cfgForm" class="box form" novalidate>
        <label>Nome da empresa <input name="companyName" maxlength="80" required></label>
        <label>WhatsApp (somente números, com 55 + DDD) <input name="whatsapp" inputmode="numeric" maxlength="15" required></label>
        <label>Título do banner <input name="heroTitle" maxlength="120"></label>
        <label>Subtítulo do banner <textarea name="heroSubtitle" rows="2" maxlength="250"></textarea></label>
        <label>Imagem do banner (enviar do celular/computador) <input type="file" accept="image/*" data-up="heroImage"><small class="upst"></small><img class="pv" alt="" hidden></label>
        <label>URL da imagem do banner <input name="heroImage" type="url"></label>
        <label>Foto da seção "Sobre" (enviar do celular/computador) <input type="file" accept="image/*" data-up="aboutImage"><small class="upst"></small><img class="pv" alt="" hidden></label>
        <label>URL da foto "Sobre" <input name="aboutImage" type="url"></label>
        <label>Texto "Sobre" <textarea name="aboutText" rows="4" maxlength="800"></textarea></label>
        <label>Endereço <input name="address" maxlength="150"></label>
        <label>Horário de atendimento <input name="hours" maxlength="100"></label>
        <label>Instagram (@usuario) <input name="instagram" maxlength="80"></label>
        <label>Taxa de entrega (R$) <input name="deliveryFee" type="number" min="0" step="0.01"></label>
        <p id="cMsg" class="msg" role="alert"></p>
        <button class="btn gold" id="cBtn" type="submit">Salvar configurações</button>
      </form>
    </section>
  </main>
</div>

<dialog id="prodDlg">
  <form id="prodForm" class="form" novalidate>
    <h3 id="dlgTitle">Novo produto</h3>
    <label>Nome <input name="name" required maxlength="100"></label>
    <label>Descrição <textarea name="description" rows="3" maxlength="300"></textarea></label>
    <label>Preço (R$) <input name="price" type="number" min="0.01" step="0.01" required></label>
    <label>Categoria <input name="category" list="catList" required maxlength="60"><datalist id="catList"><option value="Bolos de pote"><option value="Bombons de travessa"></datalist></label>
    <label>Foto do produto (enviar do celular/computador) <input type="file" accept="image/*" data-up="imageUrl"><small class="upst"></small><img class="pv" alt="" hidden></label>
    <label>ou cole a URL da imagem <input name="imageUrl" type="url" placeholder="https://..."></label>
    <label class="chk"><input name="active" type="checkbox" checked> Produto ativo (visível no site)</label>
    <p id="pMsg" class="msg" role="alert"></p>
    <div class="row"><button type="button" class="btn out" id="pCancel">Cancelar</button><button class="btn gold" id="pBtn" type="submit">Salvar</button></div>
  </form>
</dialog>
<script type="module" src="painel.js?v=3"></script>
</body>
</html>
